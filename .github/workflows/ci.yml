name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22: the oldest Node package.json allows (its test runner is the first
        # to expand the globs in `npm test`). 24: what the Vercel project runs.
        node: [22, 24]
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # mongodb-memory-server downloads a mongod binary (well over 100 MB) for
      # the integration suite. One fixed folder, so npm ci's postinstall puts
      # it where the tests look and the cache below keeps it between runs.
      - name: Point the in-memory MongoDB at a cached folder
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: npm ci
      - name: Syntax check every source file
        run: |
          set -e
          for f in index.js $(git ls-files 'src/**/*.js' 'scripts/**/*.js' 'Seeder/*.js'); do node --check "$f"; done
      # Vercel's function runtime has no require(esm): an ESM-only dependency
      # loads here on a recent Node and then crashes the deployed API.
      - name: Loads the way Vercel runs it (no require(esm))
        run: npm run check:vercel
      - name: Unit tests
        run: npm test
        env:
          JWT_SECRET: ci-secret
          MONGO_URI: mongodb://127.0.0.1:27017/ci
      - name: Integration tests (in-memory MongoDB)
        run: npm run test:integration
        env:
          # A server that cannot start is a failure here, never a skip.
          GYMPILOT_INTEGRATION_REQUIRED: '1'
